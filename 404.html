<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --hueso: #F5F1E8;
  --verde-oscuro: #1B3A2A;
  --verde-profundo: #142E20;
  --dorado: #C9A227;
  --dorado-claro: #DFB93F;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-width: 320px;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(223, 185, 63, .08), transparent 60%),
    radial-gradient(circle at 50% 100%, rgba(46, 125, 50, .12), transparent 55%),
    var(--verde-profundo);
  color: var(--hueso);
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; background: transparent; border: 0; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--dorado-claro); outline-offset: 3px; }
::selection { color: var(--verde-profundo); background: var(--dorado-claro); }

.skip-link {
  position: fixed;
  z-index: 10;
  top: 12px;
  left: 12px;
  padding: 10px 18px;
  transform: translateY(-200%);
  background: var(--dorado);
  color: var(--verde-profundo);
  font-size: .85rem;
  font-weight: 700;
  border-radius: 999px;
  transition: transform .22s var(--ease);
}
.skip-link:focus { transform: translateY(0); }

.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 56px 20px;
}

.container {
  width: 100%;
  max-width: 800px;
  text-align: center;
}

.code {
  font-family: var(--font-display);
  font-size: clamp(4rem, 14vw, 7rem);
  font-weight: 400;
  line-height: 1;
  letter-spacing: -.02em;
  color: var(--dorado);
  margin-bottom: 8px;
}

.title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 4.5vw, 2.25rem);
  font-weight: 400;
  line-height: 1.2;
  color: var(--hueso);
  margin-bottom: 16px;
}

.description {
  max-width: 56ch;
  margin: 0 auto 28px;
  color: rgba(245, 241, 232, .78);
  text-wrap: balance;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-bottom: 40px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 10px 26px;
  border: 1px solid var(--dorado);
  border-radius: 999px;
  color: var(--hueso);
  font-size: .92rem;
  font-weight: 600;
  letter-spacing: .01em;
  transition: background-color .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease);
}
.btn:hover { background: var(--dorado); color: var(--verde-profundo); }
.btn-primary { background: var(--dorado); color: var(--verde-profundo); }
.btn-primary:hover { background: var(--dorado-claro); border-color: var(--dorado-claro); }

.game {
  position: relative;
  width: 100%;
  height: clamp(240px, 42vh, 340px);
  overflow: hidden;
  background: var(--verde-oscuro);
  border: 1px solid rgba(223, 185, 63, .2);
  border-radius: 20px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  animation: fadeUp .8s var(--ease) .15s backwards;
}
.game.playing { cursor: default; }

.game-hint {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: rgba(245, 241, 232, .7);
  font-size: .95rem;
  font-weight: 500;
  letter-spacing: .04em;
  pointer-events: none;
}

.game-score {
  position: absolute;
  top: 14px;
  right: 18px;
  z-index: 2;
  color: var(--dorado-claro);
  font-size: .88rem;
  font-weight: 600;
  letter-spacing: .04em;
  pointer-events: none;
}

.game-restart {
  position: absolute;
  top: 10px;
  left: 14px;
  z-index: 2;
  padding: 5px 14px;
  border: 1px solid rgba(223, 185, 63, .5);
  border-radius: 999px;
  color: var(--hueso);
  font-size: .78rem;
  font-weight: 600;
  letter-spacing: .04em;
  transition: background-color .25s var(--ease), color .25s var(--ease);
}
.game-restart:hover { background: var(--dorado); color: var(--verde-profundo); }

.shield {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
  width: clamp(56px, 14vw, 84px);
  aspect-ratio: 1;
  padding: 0;
  border-radius: 50%;
  will-change: transform;
  touch-action: manipulation;
}
.shield img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  -webkit-user-drag: none;
  transition: transform .12s var(--ease);
}
.shield.pressed img { transform: scale(.9); }

.footer {
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  color: rgba(245, 241, 232, .5);
  font-size: .8rem;
}
.footer span { color: var(--dorado); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 560px) {
  .main { padding: 40px 16px; }
  .actions { flex-direction: column; align-items: stretch; margin-bottom: 32px; }
  .btn { width: 100%; }
  .game { border-radius: 16px; }
}

@media (max-height: 500px) and (orientation: landscape) {
  .main { padding-block: 24px; }
  .game { height: 200px; }
}

@media (prefers-reduced-motion: reduce) {
  .game { animation: none; }
  .shield img, .btn, .game-restart { transition: none; }
}
</style>
</head>
<body>

<a class="skip-link" href="#main">Saltar al contenido</a>

<main class="main" id="main">
  <div class="container">

    <h1 class="code" aria-label="Error 404">404</h1>
    <h2 class="title">Página no encontrada</h2>

    <p class="description">
      Parece que la página que buscas se perdió en el camino. Mientras tanto, ¿qué tal si juegas un poco?
    </p>

    <div class="actions">
      <a href="index.html" class="btn btn-primary">Volver al inicio</a>
      <a href="index.html#noticias" class="btn">Ver noticias</a>
    </div>

    <div class="game" id="game" role="button" tabindex="0" aria-label="Minijuego del escudo. Toca para empezar">
      <div class="game-hint" id="gameHint">Toca para empezar</div>
      <div class="game-score" id="gameScore">Puntos: 0</div>
      <button type="button" class="game-restart" id="gameRestart" hidden>Reiniciar</button>
      <button type="button" class="shield" id="shield" aria-label="Escudo: toca para sumar un punto" tabindex="-1" hidden>
        <img src="assets/images/logo.png" alt="" width="84" height="84" decoding="async" draggable="false">
      </button>
    </div>

  </div>
</main>

<footer class="footer">
  <p>© 2026 Instituto Técnico · Diseñado por <span>DevKeiner</span></p>
</footer>

<script>
(function () {
  'use strict';

  var area = document.getElementById('game');
  var shield = document.getElementById('shield');
  var hint = document.getElementById('gameHint');
  var scoreEl = document.getElementById('gameScore');
  var restartBtn = document.getElementById('gameRestart');
  if (!area || !shield || !hint || !scoreEl || !restartBtn) return;

  var BASE_SPEED = 110;
  var SPEED_STEP = 16;
  var MAX_SPEED = 520;
  var RESTART_AT = 10;
  var MIN_AXIS = 0.35;

  var playing = false;
  var score = 0;
  var speed = BASE_SPEED;
  var x = 0, y = 0, dx = 0.7071, dy = 0.7071;
  var w = 0, h = 0, size = 0;
  var last = 0;
  var raf = 0;
  var pressTimer = 0;
  var audioCtx = null;

  function measure() {
    w = area.clientWidth;
    h = area.clientHeight;
    size = shield.offsetWidth || 72;
    x = Math.max(0, Math.min(x, w - size));
    y = Math.max(0, Math.min(y, h - size));
  }

  function render() {
    shield.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
  }

  function updateScore() {
    scoreEl.textContent = 'Puntos: ' + score;
    restartBtn.hidden = score <= RESTART_AT;
  }

  function randomDirection() {
    dx = (Math.random() < 0.5 ? -1 : 1) * 0.7071;
    dy = (Math.random() < 0.5 ? -1 : 1) * 0.7071;
  }

  function nudgeDirection() {
    var angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.5;
    var c = Math.cos(angle);
    var s = Math.sin(angle);
    if (Math.abs(c) < MIN_AXIS) c = (c < 0 ? -1 : 1) * MIN_AXIS;
    if (Math.abs(s) < MIN_AXIS) s = (s < 0 ? -1 : 1) * MIN_AXIS;
    var len = Math.sqrt(c * c + s * s);
    dx = c / len;
    dy = s / len;
  }

  function beep() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var now = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(Math.min(1000 + score * 25, 1900), now);
      osc.frequency.exponentialRampToValueAtTime(Math.min(1500 + score * 25, 2400), now + 0.08);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.14, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    } catch (e) {}
  }

  function press() {
    shield.classList.add('pressed');
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function () { shield.classList.remove('pressed'); }, 130);
  }

  function tick(t) {
    if (!playing) return;
    var dt = last ? Math.min(t - last, 50) / 1000 : 0;
    last = t;

    x += dx * speed * dt;
    y += dy * speed * dt;

    if (x <= 0) { x = 0; dx = Math.abs(dx); }
    else if (x >= w - size) { x = w - size; dx = -Math.abs(dx); }
    if (y <= 0) { y = 0; dy = Math.abs(dy); }
    else if (y >= h - size) { y = h - size; dy = -Math.abs(dy); }

    render();
    raf = requestAnimationFrame(tick);
  }

  function place() {
    measure();
    x = (w - size) / 2;
    y = (h - size) / 2;
    randomDirection();
    speed = BASE_SPEED;
    render();
  }

  function start(fromKeyboard) {
    if (playing) return;
    playing = true;
    score = 0;
    area.classList.add('playing');
    area.removeAttribute('role');
    area.removeAttribute('tabindex');
    area.setAttribute('aria-label', 'Área de juego del escudo');
    hint.hidden = true;
    shield.hidden = false;
    shield.tabIndex = 0;
    place();
    updateScore();
    last = 0;
    raf = requestAnimationFrame(tick);
    if (fromKeyboard) shield.focus({ preventScroll: true });
  }

  function hit() {
    score += 1;
    speed = Math.min(BASE_SPEED + Math.floor(score / 5) * SPEED_STEP, MAX_SPEED);
    nudgeDirection();
    updateScore();
    press();
    beep();
  }

  function restart() {
    score = 0;
    place();
    updateScore();
  }

  area.addEventListener('pointerdown', function () {
    if (!playing) start(false);
  });

  area.addEventListener('keydown', function (e) {
    if (playing) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      start(true);
    }
  });

  shield.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    e.stopPropagation();
    hit();
  });

  shield.addEventListener('click', function (e) {
    if (e.detail === 0) hit();
  });

  restartBtn.addEventListener('pointerdown', function (e) {
    e.stopPropagation();
  });

  restartBtn.addEventListener('click', restart);

  window.addEventListener('resize', function () {
    if (!playing) return;
    measure();
    render();
  }, { passive: true });

  document.addEventListener('visibilitychange', function () {
    last = 0;
  });
})();
</script>

</body>
</html>
