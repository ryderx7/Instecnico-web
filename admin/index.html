  <!-- Pantalla de carga -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #custom-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 22px;
      background:
        radial-gradient(circle at 50% 40%, rgba(0, 255, 136, 0.08) 0%, transparent 60%),
        #000;
      z-index: 999999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #custom-loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-logo {
      width: 72px;
      height: 72px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 136, 0.15);
      border-top-color: #00ff88;
      animation: spin 1s linear infinite;
    }

    .loader-ring::after {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px solid rgba(0, 255, 136, 0.1);
      animation: pulse 2s ease-out infinite;
    }

    .loader-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 24px #00ff88;
      animation: floatDot 2s ease-in-out infinite;
    }

    .loader-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .loader-text .green { color: #00ff88; }

    .loader-sub {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.72rem;
      color: #666;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: -6px;
      font-weight: 600;
    }

    .loader-bar {
      width: 180px;
      height: 3px;
      background: #1a1a1a;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar::after {
      content: '';
      position: absolute;
      top: 0; left: -40%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #00ff88, transparent);
      animation: barSlide 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.8; }
      100% { transform: scale(1.2); opacity: 0; }
    }

    @keyframes floatDot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes barSlide {
      0% { left: -40%; }
      100% { left: 100%; }
    }
  </style>

  <!-- Tema personalizado del CMS -->
  <style id="decap-custom-theme">
    /* ============================================================
   DECAP CMS · TEMA PREMIUM INSTITUTO TÉCNICO
   Paleta: Grises suaves + Verde neón
   Optimizado Desktop + Móvil · v2.0
   ============================================================ */

:root {
  --a-bg: #0d0d0d;
  --a-bg-1: #121212;
  --a-bg-2: #181818;
  --a-bg-3: #1e1e1e;
  --a-bg-4: #242424;
  --a-bg-5: #2a2a2a;

  /* Bordes */
  --a-border: #2c2c2c;
  --a-border-strong: #3a3a3a;
  --a-border-focus: #00ff88;

  /* Verde neón */
  --a-primary: #00ff88;
  --a-primary-hover: #00d977;
  --a-primary-dim: rgba(0, 255, 136, 0.08);
  --a-primary-glow: rgba(0, 255, 136, 0.25);

  /* Textos */
  --a-text: #f0f0f0;
  --a-text-2: #d4d4d4;
  --a-text-muted: #a3a3a3;
  --a-text-dim: #707070;
  --a-text-inverse: #0d0d0d;

  /* Peligro */
  --a-danger: #ff5252;
  --a-danger-dim: rgba(255, 82, 82, 0.1);

  /* Aviso */
  --a-warning: #ffb547;

  /* Tipografía */
  --a-font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --a-font-heading: 'Space Grotesk', sans-serif;
  --a-font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Radios */
  --a-radius-sm: 6px;
  --a-radius: 10px;
  --a-radius-lg: 14px;
  --a-radius-xl: 20px;

  /* Sombras */
  --a-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
  --a-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  --a-shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
  --a-shadow-glow: 0 0 0 3px var(--a-primary-dim);
}

/* === Base: forzar grises suaves en TODO === */
html, body, #nc-root {
  background-color: var(--a-bg) !important;
  background-image: none !important;
  color: var(--a-text) !important;
  font-family: var(--a-font) !important;
  -webkit-font-smoothing: antialiased !important;
  -moz-osx-font-smoothing: grayscale !important;
  min-height: 100vh !important;
  overflow-x: hidden !important;
}

#nc-root *, #nc-root *::before, #nc-root *::after {
  font-family: var(--a-font);
  box-sizing: border-box;
}

/* Headings */
#nc-root h1, #nc-root h2, #nc-root h3,
#nc-root h4, #nc-root h5, #nc-root h6 {
  font-family: var(--a-font-heading) !important;
  letter-spacing: -0.02em !important;
  color: var(--a-text) !important;
  font-weight: 700 !important;
}

/* FIX: fondos blancos por defecto */
#nc-root,
#nc-root *:not(svg):not(path):not(img):not(input):not(textarea):not(select):not(hr):not(br) {
  background-image: none !important;
}

/* FIX AGRESIVO: eliminar fondos blancos inline */
#nc-root > div,
#nc-root > div > div,
#nc-root main,
#nc-root main > div,
#nc-root section,
#nc-root article,
#nc-root form,
#nc-root form > div,
#nc-root [class*="Pane"],
#nc-root [class*="Container"],
#nc-root [class*="Page"],
#nc-root [class*="Collection"],
#nc-root [class*="Entry"],
#nc-root [class*="Editor"],
#nc-root [class*="Split"],
#nc-root [class*="ControlPane"],
#nc-root [class*="PreviewPane"] {
  background-color: var(--a-bg) !important;
  background: var(--a-bg) !important;
}

/* Los divs internos decorativos: transparentes */
#nc-root div[style*="background"],
#nc-root div[style*="bg"],
#nc-root div[style*="white"] {
  background-color: transparent !important;
  background: transparent !important;
}

/* Texto general */
#nc-root *:not(svg):not(path):not(svg *) {
  color: var(--a-text-2);
}

#nc-root strong, #nc-root b {
  color: var(--a-text) !important;
}

/* Links */
#nc-root a {
  color: var(--a-primary) !important;
  text-decoration: none !important;
  transition: color 0.2s ease !important;
}

#nc-root a:hover {
  color: var(--a-primary-hover) !important;
}

/* === Scrollbar === */
#nc-root ::-webkit-scrollbar,
body::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

#nc-root ::-webkit-scrollbar-track,
body::-webkit-scrollbar-track {
  background: var(--a-bg-1);
}

#nc-root ::-webkit-scrollbar-thumb,
body::-webkit-scrollbar-thumb {
  background: var(--a-border-strong);
  border-radius: 5px;
  transition: background 0.2s ease;
}

#nc-root ::-webkit-scrollbar-thumb:hover,
body::-webkit-scrollbar-thumb:hover {
  background: var(--a-primary);
}

#nc-root [class*="ListItem"],

#nc-root [class*="Toast"] * {
  color: var(--a-text) !important;
}


#nc-root [role="listbox"],
#nc-root [role="menu"] {
  background: var(--a-bg-3) !important;
  border: 1px solid var(--a-border-strong) !important;
  border-radius: var(--a-radius) !important;
  box-shadow: var(--a-shadow-lg) !important;
  padding: 8px !important;
}

#nc-root [role="option"] {
  padding: 11px 14px !important;
  border-radius: var(--a-radius-sm) !important;
  color: var(--a-text-2) !important;
  transition: all 0.15s ease !important;
  cursor: pointer !important;
  font-size: 0.92rem !important;
}

#nc-root [role="option"]:hover {
  background: var(--a-primary-dim) !important;
  color: var(--a-primary) !important;
}

#nc-root [role="option"][aria-selected="true"] {
  background: var(--a-primary) !important;
  color: var(--a-text-inverse) !important;
}

#nc-root input[type="checkbox"],
#nc-root input[type="radio"] {
  accent-color: var(--a-primary) !important;
  width: 20px !important;
  height: 20px !important;
  cursor: pointer !important;
  margin-right: 8px !important;
}

#nc-root *:focus-visible {
  outline: 2px solid var(--a-primary) !important;
  outline-offset: 2px !important;
  border-radius: var(--a-radius-sm) !important;
}

/* Panel de edición: más aire */
#nc-root [class*="ControlPane"] {
  padding: 28px !important;
  background: var(--a-bg) !important;
}

/* Separación entre campos */
#nc-root [class*="ControlPane"] > div,
#nc-root [class*="Field"] {
  margin-bottom: 24px !important;
}

/* Panel de vista previa: fondo gris suave */
#nc-root [class*="PreviewPane"] {
  background: var(--a-bg-1) !important;
  border-left: 1px solid var(--a-border) !important;
  padding: 24px !important;
}

/* Barra de acciones inferior (Publicar/Guardar) */
#nc-root [class*="ToolbarContainer"],
#nc-root [class*="Actions"] {
  background: var(--a-bg-1) !important;
  border-top: 1px solid var(--a-border) !important;
  padding: 16px 24px !important;
  position: sticky !important;
  bottom: 0 !important;
  z-index: 10 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 12px !important;
}

/* Botones de la barra de acciones */
#nc-root [class*="ToolbarContainer"] button,
#nc-root [class*="Actions"] button {
  margin-left: 8px !important;
}

/* MÓVIL */
@media (max-width: 768px) {

  html, body, #nc-root {
    overflow-x: hidden !important;
  }

  /* Header compacto */
  #nc-root header {
    padding: 12px 16px !important;
  }

  /* Sidebar a ancho completo */
  #nc-root aside,
  #nc-root [class*="Sidebar"] {
    width: 100% !important;
    max-width: 100% !important;
    border-right: none !important;
    border-bottom: 1px solid var(--a-border) !important;
  }

  /* Layout en una columna */
  #nc-root [class*="Editor"],
  #nc-root [class*="EntryEditor"],
  #nc-root [class*="Split"] {
    display: flex !important;
    flex-direction: column !important;
    width: 100% !important;
  }

  /* Vista previa abajo en móvil */
  #nc-root [class*="PreviewPane"],
  #nc-root [class*="ControlPane"] + div {
    width: 100% !important;
    max-width: 100% !important;
    border-left: none !important;
    border-top: 1px solid var(--a-border) !important;
    padding: 20px !important;
  }

  /* Panel de edición: menos padding */
  #nc-root [class*="ControlPane"] {
    padding: 18px !important;
  }

  #nc-root [class*="ControlPane"] > div,
  #nc-root [class*="Field"] {
    margin-bottom: 20px !important;
  }

  /* Tarjetas de noticias */
  #nc-root [class*="ListItem"] {
    padding: 16px 18px !important;
    gap: 12px !important;
    flex-wrap: wrap !important;
  }

  /* Botón añadir full width */
  #nc-root a[href*="new"],
  #nc-root button[class*="add"] {
    width: 100% !important;
    justify-content: center !important;
  }

  /* Inputs grandes para touch */
  #nc-root input[type="text"],
  #nc-root input[type="email"],
  #nc-root input[type="number"],
  #nc-root input[type="url"],
  #nc-root input[type="search"],
  #nc-root input[type="datetime-local"],
  #nc-root input[type="date"],
  #nc-root input[type="time"],
  #nc-root input[type="password"],
  #nc-root textarea,
  #nc-root select {
    font-size: 16px !important;
    padding: 14px 16px !important;
    min-height: 50px !important;
  }

  /* Labels */
  #nc-root label {
    font-size: 0.95rem !important;
    margin-bottom: 10px !important;
  }

  /* Editor */
  #nc-root [contenteditable="true"] {
    min-height: 260px !important;
    padding: 18px !important;
    font-size: 16px !important;
  }

  /* Toolbar apilada */
  #nc-root [class*="Toolbar"] {
    padding: 10px 12px !important;
    gap: 8px !important;
  }

  #nc-root [class*="Toolbar"] button {
    flex: 1 1 auto !important;
    min-width: 0 !important;
    padding: 10px 12px !important;
    font-size: 0.85rem !important;
    min-height: 42px !important;
  }

  /* Descripción */
  #nc-root [class*="Description"] {
    padding: 14px 18px !important;
    font-size: 0.88rem !important;
  }

  /* Botones generales */
  #nc-root button {
    min-height: 44px !important;
    font-size: 0.95rem !important;
  }

  /* Barra de acciones en móvil */
  #nc-root [class*="ToolbarContainer"],
  #nc-root [class*="Actions"] {
    padding: 12px 16px !important;
    flex-direction: column-reverse !important;
    gap: 8px !important;
  }

  #nc-root [class*="ToolbarContainer"] button,
  #nc-root [class*="Actions"] button {
    width: 100% !important;
    margin: 0 !important;
  }

  /* Modales */
  #nc-root [class*="Modal"] {
    margin: 12px !important;
    border-radius: var(--a-radius-lg) !important;
    max-height: calc(100vh - 24px) !important;
    overflow-y: auto !important;
  }

  /* Evitar scroll horizontal */
  #nc-root div, #nc-root section, #nc-root article {
    max-width: 100% !important;
  }
}


@media (min-width: 769px) and (max-width: 1024px) {

  #nc-root [class*="ControlPane"] {
    padding: 22px !important;
  }

  #nc-root [class*="PreviewPane"] {
    padding: 20px !important;
  }
}

/* ============================================================
   FORZAR DARK MODE SI EL SISTEMA USA LIGHT
   ============================================================ */
@media (prefers-color-scheme: light) {
  html, body, #nc-root {
    background: var(--a-bg) !important;
    background-color: var(--a-bg) !important;
    color: var(--a-text) !important;
  }
}

/* ============================================================
   REDUCIR MOVIMIENTO
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  #nc-root *,
  #nc-root *::before,
  #nc-root *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

<body>

  <!-- Pantalla de carga -->
  <div id="custom-loading" role="status" aria-live="polite">
    <div class="loader-logo">
      <div class="loader-ring"></div>
      <div class="loader-dot"></div>
    </div>
    <div class="loader-text">Ins<span class="green">Tecnico</span></div>
    <div class="loader-sub">Panel de administración</div>
    <div class="loader-bar"></div>
  </div>

  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    (function () {
      var loading = document.getElementById('custom-loading');
      var startTime = Date.now();
      var MIN_DISPLAY = 800;
      var MAX_WAIT = 5000;
      var hidden = false;

      function hide() {
        if (hidden || !loading) return;
        hidden = true;
        var elapsed = Date.now() - startTime;
        var remaining = Math.max(0, MIN_DISPLAY - elapsed);
        setTimeout(function () {
          loading.classList.add('hidden');
          setTimeout(function () {
            if (loading && loading.parentNode) {
              loading.parentNode.removeChild(loading);
            }
          }, 700);
        }, remaining);
      }

      if (document.readyState === 'complete') {
        setTimeout(hide, 300);
      } else {
        window.addEventListener('load', function () {
          setTimeout(hide, 300);
        });
      }

      setTimeout(hide, MAX_WAIT);
    })();
  </script>

</body>
</html>
